[package]
name = "siox-lsp"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Siox-lang/siox-lsp"
authors = ["siox contributors"]
description = "Language Server Protocol implementation for siox"

[[bin]]
name = "siox-lsp"
path = "src/main.rs"

[dependencies]
# The language server needs only the backend-independent core (frontend +
# IR/lints for diagnostics), never the LLVM backend. Building needs no LLVM.
siox = { git = "https://github.com/Siox-lang/sioxc.git", default-features = false }
# JSON-RPC wire values and standards-compliant file URI conversion.
serde_json = "1"
url = "2"
